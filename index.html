<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />

    <!--
      Everything between these markers is replaced at build time by
      `scripts/prerender.mjs`, which generates it from `src/lib/seo.ts` — one
      source of truth for the title, the description, Open Graph, hreflang and
      the canonical URL, shared with the JSON-LD graph so the two cannot drift.

      What is written here is the development fallback, and only has to be
      good enough to look right in a browser tab.
    -->
    <!--seo:head-->
    <title>NutriFit — Calorie Counter, Barcode Scanner &amp; AI Coach</title>
    <meta
      name="description"
      content="Free Android food diary: scan barcodes from 3.5M+ products, read a meal off a photo with AI, track macros, water, steps and workouts. Offline, no account."
    />
    <link rel="canonical" href="https://nutrifit-73de0.web.app/" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--/seo:head-->

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />

    <!--seo:jsonld-->
  </head>
  <body>
    <!--
      The build writes the fully rendered page in here. React then throws it
      away and mounts its own tree over the top — deliberately, because the
      alternative is hydrating markup whose entrance animations have already
      been played, and a mismatch on every animated element.

      The swap is invisible: the prerendered markup includes the loader in its
      covering state, so the cover is what a reader sees both before and after
      React takes over. What the static HTML buys is a crawler, a scraper or an
      answer engine reading the whole page without executing a line of
      JavaScript, and a first paint that does not wait for the bundle.
    -->
    <div id="root"><!--seo:app--></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      NutriFit is a calorie, activity and wellness diary for Android. Please enable JavaScript, or
      find it on Google Play as com.madmediadeveloping.nutrifit.
    </noscript>
  </body>
</html>
